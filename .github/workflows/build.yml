name: Build LeviVision

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          add-to-path: true

      - name: Configure
        run: |
          cmake -S . -B build-${{ matrix.abi }} \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DMOD_ID=levivision \
            -DMOD_NAME="LeviVision" \
            -DMOD_AUTHOR="Say" \
            -DMOD_VERSION=1.0.0 \
            -DMOD_LIBRARY_NAME=levivision \
            -DMOD_MINECRAFT_VERSIONS='["1.21.100*"]' \
            -DMOD_ICON="assets/icon.png"

      - name: Build + Package
        run: cmake --build build-${{ matrix.abi }} --target levi_package

      - name: Locate artifact
        id: find
        run: echo "path=$(find build-${{ matrix.abi }} -maxdepth 1 -name '*.levipack')" >> "$GITHUB_OUTPUT"

      - name: Upload .levipack
        uses: actions/upload-artifact@v4
        with:
          name: LeviVision-${{ matrix.abi }}
          path: ${{ steps.find.outputs.path }}
          if-no-files-found: error
